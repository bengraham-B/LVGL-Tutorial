[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_ldf_mode = deep

lib_deps =
    SPI
    bodmer/TFT_eSPI@^2.5.43
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git
    lvgl/lvgl@^9.6.0

build_flags =
    -I include
    -DLV_LVGL_H_INCLUDE_SIMPLE
    -DLV_CONF_PATH=\"${PROJECT_DIR}/include/lv_conf.h\"

; ---- TFT_eSPI pins ----
    -DUSER_SETUP_LOADED=1
    -DILI9341_DRIVER
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH
    -DSPI_FREQUENCY=27000000
    -DLOAD_GLCD
    -DLOAD_FONT2
    -DLOAD_FONT4
    -DLOAD_FONT6
    -DLOAD_FONT7
    -DLOAD_FONT8
    -DLOAD_GFXFF
    -DSMOOTH_FONT

; ---- Touch ----
    -DTOUCH_CS=33